name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -c tests/pytest.ini --rootdir tests tests -q
  catalog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: NullAITech/zoth-studio-v2
          path: zoth-studio-v2
          sparse-checkout: src/data
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Fails if data/studio_tools.json no longer matches Zoth Studio's catalog.
      - run: python3 scripts/sync_catalog.py --studio zoth-studio-v2 --check
